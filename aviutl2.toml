#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。
[project]
id = "Book-0225.EAP2"
name = "External_Audio_Processing2"
version = "0.0.37"

[build_group]
debug_group = "cmake --build ./build --config Debug"
release_group = "cmake --build ./build --config Release"

[artifacts.English_External_Audio_Processing2_aul2]
source = "lang/English.External_Audio_Processing2.aul2"
enabled = true
destination = "Language/English.External_Audio_Processing2.aul2"

[artifacts.Default_External_Audio_Processing2_aul2]
source = "lang/Default.External_Audio_Processing2.aul2"
enabled = true
destination = "Language/Default.External_Audio_Processing2.aul2"

[artifacts.External_Audio_Processing2_aux2]
source = "build/bin/External_Audio_Processing2.aux2"
enabled = true
destination = "Plugin/External_Audio_Processing2.aux2"

[artifacts.External_Audio_Processing2_aux2.profiles.debug]
build = { group = "debug_group"}

[artifacts.External_Audio_Processing2_aux2.profiles.release]
build = { group = "release_group"}

[development]
aviutl2_version = "latest"

[preview]
aviutl2_version = "latest"

[release]
output_dir = "release"
package_template = "package.txt"
zip_name = "{name}"
profile = "release"
prebuild = "pwsh  -ExecutionPolicy Bypass -File ./scripts/sync_version.ps1"
package_name = "External Audio Processing 2"
package_information = "External Audio Processing 2 v{version} by BOOK25"